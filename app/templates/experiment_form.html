{% extends "base.html" %}
{% block title %}{{ "Edit" if experiment else "New" }} experiment{% endblock %}
{% block content %}
<h2>{{ "Edit" if experiment else "New" }} experiment</h2>
<form method="post" action="{{ '/experiments/%d/edit' % experiment.id if experiment else '/experiments' }}">
  <p><label>Slug / filename<br>
    <input type="text" name="slug" required style="width:100%"
           value="{{ experiment.slug if experiment else '' }}"></label></p>
  <p><label>Title / aim of experiment<br>
    <input type="text" name="title" style="width:100%"
           value="{{ experiment.title if experiment else '' }}"></label></p>
  <p><label>Experiment date<br>
    <input type="date" name="experiment_date"
           value="{{ experiment.experiment_date if experiment else default_experiment_date }}"></label></p>
  <p><label>Experiment group<br>
    <input type="text" name="experiment_group" value="{{ experiment.experiment_group if experiment else '' }}"></label></p>
  <p><label>Repetition<br>
    <input type="text" name="repetition" value="{{ experiment.repetition if experiment else '' }}"></label></p>
  <p><label>Injection stage<br>
    <input type="text" name="injection_stage"
           value="{{ experiment.injection_stage if experiment else default_injection_stage }}"></label></p>
  <p><label>Incubation at<br>
    <input type="text" name="incubation_at"
           value="{{ experiment.incubation_at if experiment else default_incubation_at }}"></label></p>
  <p><button type="submit">Save</button></p>
</form>
{% endblock %}
